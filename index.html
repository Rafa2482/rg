<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrar</title>

<style>

*{
    box-sizing: border-box;
}

html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: #eeeeee;
    color: #111;
}


/* =========================
   TOPO
========================= */

.topo{
    height: 94px;
    background: #ffffff;

    display: flex;
    align-items: center;

    padding: 18px 20px 0;

    font-size: 21px;
    font-weight: 400;
}


/* =========================
   CONTEÚDO
========================= */

.container{
    width: 100%;
    padding: 0 20px;
}


/* =========================
   LOGO POLÍCIA CIVIL
========================= */

.foto{
    width: 105px;
    height: 125px;

    margin: 64px auto 57px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.foto img{
    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* =========================
   TÍTULO
========================= */

h1{
    margin: 0 0 20px 0;

    font-size: 30px;
    line-height: 1.15;

    font-weight: 700;
}


/* =========================
   SUBTÍTULO
========================= */

.sub{
    margin-bottom: 19px;

    font-size: 21px;
    line-height: 1.3;

    color: #181818;
}


/* =========================
   CAMPO DE SENHA
========================= */

.input-box{
    position: relative;

    width: 100%;
    height: 62px;
}

input{
    width: 100%;
    height: 100%;

    padding: 0 60px 0 25px;

    background: #ffffff;

    border: 1.5px solid #c9c9c9;
    border-radius: 6px;

    outline: none;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 20px;

    color: #333333;
}

input::placeholder{
    color: #5d5d5d;
    opacity: 1;
}

input:focus{
    border-color: #777777;
}


/* =========================
   OLHO
========================= */

.olho{
    position: absolute;

    right: 21px;
    top: 50%;

    transform: translateY(-50%);

    width: 30px;
    height: 30px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    -webkit-tap-highlight-color: transparent;
}

.olho svg{
    width: 30px;
    height: 30px;

    stroke: #555555;

    fill: none;

    stroke-width: 2.2;

    stroke-linecap: round;
    stroke-linejoin: round;
}


/* =========================
   ESQUECI MINHA SENHA
========================= */

.esqueci{
    text-align: right;

    color: #075078;

    font-size: 19px;

    font-weight: 700;

    margin-top: 19px;
    margin-bottom: 40px;

    padding-right: 18px;

    cursor: pointer;
}


/* =========================
   BOTÃO ENTRAR
========================= */

.botao{
    width: 100%;
    height: 62px;

    padding: 0;

    background: #adadad;

    border: none;
    border-radius: 10px;

    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 20px;
    font-weight: 700;

    transition: background 0.2s;

    cursor: default;
}


/* QUANDO DIGITAR A SENHA */

.botao.ativo{
    background: #0b5278;
    cursor: pointer;
}


/* =========================
   LINKS INFERIORES
========================= */

.footer{
    width: 100%;

    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-top: 38px;

    padding: 0 18px;

    color: #075078;

    font-size: 17px;

    font-weight: 700;
}

.footer div{
    cursor: pointer;
}


/* =========================
   AJUSTES PARA CELULARES
   MENORES
========================= */

@media(max-width: 380px){

    .topo{
        height: 84px;

        padding-left: 18px;

        font-size: 20px;
    }

    .container{
        padding-left: 18px;
        padding-right: 18px;
    }

    .foto{
        width: 92px;
        height: 110px;

        margin-top: 53px;
        margin-bottom: 48px;
    }

    h1{
        font-size: 27px;
        margin-bottom: 17px;
    }

    .sub{
        font-size: 19px;
    }

    .input-box{
        height: 58px;
    }

    input{
        font-size: 18px;
        padding-left: 21px;
    }

    .esqueci{
        font-size: 17px;
        margin-bottom: 35px;
    }

    .botao{
        height: 59px;
        font-size: 19px;
    }

    .footer{
        font-size: 16px;
        padding: 0 10px;
    }
}

</style>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));}</script>
</head>

<link rel="manifest" href="./manifest.webmanifest">

<meta name="theme-color" content="#1f4e6b">

<link rel="apple-touch-icon" href="./icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Demo">

<body>


<!-- TOPO -->

<header class="topo">
    Entrar
</header>


<!-- CONTEÚDO -->

<main class="container">


    <!-- LOGO -->

    <div class="foto">

        <img
            src="sua-foto.jpg"
            alt="Polícia Civil"
        >

    </div>



    <!-- TÍTULO -->

    <h1>
        Acesse a sua conta
    </h1>



    <!-- SUBTÍTULO -->

    <div class="sub">
        Insira sua senha para entrar.
    </div>



    <!-- CAMPO DE SENHA -->

    <div class="input-box">

        <input
            type="password"
            placeholder="Senha"
            id="senha"
            oninput="verificarSenha()"
        >


        <!-- ÍCONE DO OLHO -->

        <div
            class="olho"
            onclick="mostrarSenha()"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M3 3l18 18"></path>

                <path d="M10.6 10.7a2 2 0 0 0 2.7 2.7"></path>

                <path d="M9.9 4.2A10.7 10.7 0 0 1 12 4c5.5 0 9 5 9 5s-1.1 1.6-3 3"></path>

                <path d="M6.6 6.6C4.3 8 3 10 3 10s3.5 5 9 5c1 0 1.9-.2 2.7-.5"></path>

            </svg>

        </div>

    </div>



    <!-- ESQUECI SENHA -->

    <div class="esqueci">
        Esqueci minha senha
    </div>



    <!-- BOTÃO -->

    <button
        class="botao"
        id="btnEntrar"
        onclick="entrar()"
    >
        Entrar
    </button>



    <!-- LINKS -->

    <div class="footer">

        <div>
            Ajuda
        </div>

        <div>
            Privacidade
        </div>

        <div>
            Termos
        </div>

    </div>


</main>



<script>

/* MOSTRAR / ESCONDER SENHA */

function mostrarSenha(){

    const input =
        document.getElementById("senha");

    if(input.type === "password"){

        input.type = "text";

    }else{

        input.type = "password";

    }

}


/* ATIVAR BOTÃO */

function verificarSenha(){

    const senha =
        document.getElementById("senha").value;

    const botao =
        document.getElementById("btnEntrar");


    if(senha.length > 0){

        botao.classList.add("ativo");

    }else{

        botao.classList.remove("ativo");

    }

}


/* ENTRAR */

function entrar(){

    const senha =
        document.getElementById("senha").value;


    if(senha.length > 0){

        window.location.href =
            "documento.html";

    }

}

</script>


<button class="install-demo" id="installDemo" hidden>Instalar demonstração</button>
<script>let installPrompt;const ib=document.getElementById("installDemo");window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;if(ib)ib.hidden=false;});if(ib)ib.addEventListener("click",async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;ib.hidden=true;});</script>
</body>
</html>
